name: Convert Laya to ONNX
# Publishes a GitHub release that Silktone downloads when Voice Commands (beta)
# is turned on. Runs when the converter changes, or manually from main
# (Actions → Convert Laya to ONNX → Run workflow) to publish under a new tag.
on:
  push:
    branches: [main, "silktone-*"]
    paths:
      - scripts/laya/**
      - .github/workflows/laya-onnx.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the converted model
        default: laya-onnx-v1
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || 'laya-onnx-v1' }}
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install "transformers>=4.48,<5" safetensors huggingface_hub onnx onnxruntime==1.20.1 numpy
      - name: Convert and verify
        run: python scripts/laya/export_onnx.py --out laya-onnx
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="laya-onnx/laya-int8.onnx laya-onnx/laya.onnx laya-onnx/tokenizer.json laya-onnx/laya-config.json laya-onnx/parity.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" --prerelease \
              --title "Laya ONNX ($TAG)" \
              --notes "Laya (convaiinnovations/laya, Apache-2.0) converted to ONNX for Silktone Voice Commands (beta). parity.json compares it with the original PyTorch model."
          fi
