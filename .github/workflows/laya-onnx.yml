name: Convert Laya to ONNX
# Publishes a GitHub release that Silktone downloads when Voice Commands (beta)
# is turned on. Runs when the converter changes, or manually from main
# (Actions → Convert Laya to ONNX → Run workflow) to publish under a new tag.
on:
  push:
    branches: [main, "silktone-*"]
    paths:
      - scripts/laya/**
      - .github/workflows/laya-onnx.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the converted model
        default: laya-onnx-v1
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || 'laya-onnx-v1' }}
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install converter dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install "transformers>=4.48,<5" safetensors huggingface_hub onnx onnxruntime==1.20.1 numpy
      - name: Convert and verify
        shell: bash
        run: |
          set -o pipefail
          if ! python -u scripts/laya/export_onnx.py --out laya-onnx 2>&1 | tee convert.log; then
            # Job logs need a GitHub login to read; annotations do not.
            # GitHub keeps up to 10 annotations of each level per step.
            grep -v '^\s*$' convert.log | tail -n 20 | head -n 10 | cut -c1-300 | sed 's/%/%25/g; s/^/::warning title=log::/'
            grep -v '^\s*$' convert.log | tail -n 10 | cut -c1-300 | sed 's/%/%25/g; s/^/::error title=log::/'
            exit 1
          fi
          echo "::notice title=Laya accuracy::$(grep -E '^ACCURACY' convert.log | sed 's/^ACCURACY //' | tr '\n' ';')"
          grep -E "^(CHOSEN|PARITY|RECOMMENDED|NODES|SKIP)" convert.log | sed "s/^/::notice title=Laya::/" || true
          grep -E "^  miss" convert.log | head -n 10 | sed "s/^/::warning title=Laya miss::/" || true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="laya-onnx/laya-int8.onnx laya-onnx/laya.onnx laya-onnx/tokenizer.json laya-onnx/laya-config.json laya-onnx/report.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" --prerelease \
              --title "Laya ONNX ($TAG)" \
              --notes "Laya (convaiinnovations/laya, Apache-2.0) converted to ONNX for Silktone Voice Commands (beta). report.json has the checkpoint comparison and the ONNX-vs-PyTorch parity check."
          fi
