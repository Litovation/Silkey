name: Build Silktone for Windows
on:
  push:
    branches: [main, "v0.1.1-ui", "silktone-*"]
    paths-ignore:
      - scripts/laya/**
      - .github/workflows/laya-onnx.yml
      - "**.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # Test builds update themselves like releases (see settings.rs).
      SILKTONE_UPDATES_ENABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      # Keeps compiled dependencies (speech engine, Tauri, ...) between runs,
      # so a build only recompiles what changed. Shared by both workflows.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: silktone-windows
      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      # Compiler errors become public annotations (job logs need a GitHub login).
      - run: echo "::add-matcher::.github/rust-errors-matcher.json"
      - name: Build installer and verify native runtime
        shell: pwsh
        run: ./scripts/build-silktone-windows.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Silktone-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 14
