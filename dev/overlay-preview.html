<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Silktone bar preview</title>
    <script>
      // Browser-only stand-in for the Tauri backend so the recording overlay and
      // the Silktone bar can be looked at without the Rust app. Not shipped.
      // ?state=idle|hover|nudge|recording|streaming picks what to show;
      // ?position=top moves it up top; ?theme=dark for dark mode. A desktop-ish
      // backdrop shows the glass surface; the box marks the native window size.
      const params = new URLSearchParams(location.search);
      const settings = {
        theme: params.get("theme") || "light",
        app_language: "en",
        overlay_position: params.get("position") || "bottom",
        bindings: { transcribe: { current_binding: "ctrl_left+super_left" } },
      };
      let nextId = 1;
      const callbacks = {};
      const listeners = {};
      window.__emit = (event, payload = null) =>
        (listeners[event] || []).forEach(
          (id) => callbacks[id] && callbacks[id]({ event, payload, id }),
        );
      const handlers = {
        get_app_settings: () => settings,
        "plugin:event|listen": (a) => (
          (listeners[a.event] ||= []).push(a.handler),
          a.handler
        ),
        "plugin:event|unlisten": () => null,
        silktone_bar_refresh: () =>
          setTimeout(() => {
            window.__emit("show-overlay", params.get("state") || "idle");
            window.__emit("command-feedback", "No speech heard");
            window.__emit("ai-answer", {
              question: "What's 15% of 2,340?",
              answer: "15% of 2,340 is 351.",
            });
          }, 50),
        silktone_bar_hover: (a) =>
          window.__emit("show-overlay", a.hovered ? "hover" : "idle"),
      };
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "recording_overlay" },
          currentWebview: {
            label: "recording_overlay",
            windowLabel: "recording_overlay",
          },
        },
        transformCallback: (fn) => {
          const id = nextId++;
          callbacks[id] = fn;
          return id;
        },
        invoke: async (cmd, args) =>
          handlers[cmd] ? handlers[cmd](args) : null,
      };
      window.__TAURI_OS_PLUGIN_INTERNALS__ = {
        platform: "windows",
        os_type: "windows",
        family: "windows",
        arch: "x86_64",
        version: "10",
        eol: "\r\n",
        exe_extension: "exe",
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
        unregisterListener: () => {},
      };
      const sizes = {
        idle: [96, 30],
        hover: [320, 66],
        nudge: [400, 136],
        answer: [440, 260],
        edited: [300, 66],
        streaming: [432, 164],
      };
      const [w, h] = sizes[params.get("state") || "idle"] || [256, 66];
      document.documentElement.style.setProperty("--w", w + "px");
      document.documentElement.style.setProperty("--h", h + "px");
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: linear-gradient(135deg, #c9d6e3, #e9e2d6 55%, #d7e4d8);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #frame {
        width: var(--w);
        height: var(--h);
        position: relative;
        transform: translateZ(0);
        outline: 1px dashed rgb(0 0 0 / 0.15);
      }
      #root {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="frame"><div id="root"></div></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
