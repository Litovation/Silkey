<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silktone mock preview</title>
    <script>
      // Browser-only stand-in for the Tauri backend so the settings UI can be
      // looked at without building the Rust app. Not shipped.
      // ?firstRun=1 shows the first-launch walkthrough with the model mid-download.
      const firstRun = new URLSearchParams(location.search).has("firstRun");
      const settings = {
        onboarding_completed: !firstRun,
        bindings: {
          transcribe: {
            id: "transcribe",
            name: "Transcribe Shortcut",
            description: "Converts your speech into text.",
            default_binding: "ctrl_left+super_left",
            current_binding: "ctrl_left+super_left",
          },
          transcribe_with_post_process: {
            id: "transcribe_with_post_process",
            name: "Post-Process Shortcut",
            description: "Transcribe with post-processing.",
            default_binding: "ctrl_left+shift_left+super_left",
            current_binding: "ctrl_left+shift_left+super_left",
          },
        },
        shortcut_activation: "hold_or_toggle",
        selected_language: "en",
        selected_model: firstRun ? "" : "mock",
        app_language: "en",
        theme: new URLSearchParams(location.search).get("theme") || "light",
        autostart_enabled: true,
        show_tray_icon: true,
        overlay_style: "live",
        overlay_position: "top",
        vad_enabled: true,
        filler_word_removal_enabled: true,
        auto_submit: false,
        append_trailing_space: false,
        experimental_enabled: true,
        post_process_enabled: true,
        post_process_provider_id: "groq",
        post_process_providers: [
          { id: "groq", label: "Groq", base_url: "https://api.groq.com/openai/v1", allow_base_url_edit: false },
          { id: "openrouter", label: "OpenRouter", base_url: "https://openrouter.ai/api/v1", allow_base_url_edit: false },
          { id: "custom", label: "Custom", base_url: "http://localhost:11434/v1", allow_base_url_edit: true },
        ],
        post_process_api_keys: {},
        post_process_models: {},
        post_process_prompts: [],
        post_process_selected_prompt_id: null,
        custom_words: [],
        history_limit: 5,
        recording_retention_period: "preserve_limit",
        transcribe_accelerator: "auto",
        ort_accelerator: "auto",
        mute_while_recording: false,
        trackpad_double_tap_enabled: false,
        keyboard_implementation: "native_keys",
        debug_mode: false,
      };
      const model = {
        id: "mock",
        name: "Mock",
        description: "",
        is_downloaded: !firstRun,
        is_downloading: false,
        is_recommended: true,
        source: { HuggingFace: {} },
        supported_languages: ["en", "hi", "fr"],
        supports_language_selection: true,
        supports_language_detection: true,
        supports_translation: false,
        supports_streaming: true,
      };
      const handlers = {
        get_app_settings: () => settings,
        get_default_settings: () => settings,
        get_available_models: () => [model],
        get_current_model: () => settings.selected_model,
        download_model: () => new Promise(() => {}),
        get_model_info: () => model,
        "plugin:app|version": () => "0.1.1",
        "plugin:event|listen": () => 1,
        "plugin:event|unlisten": () => null,
        get_history_entries: (a) => (a && a.cursor) ? { entries: [], has_more: false } : { entries: [
          { id: 2, file_name: "b.wav", timestamp: Math.floor(Date.now()/1000) - 600, saved: false, title: "", transcription_text: "From now on, my workflow will be very easy.", post_processed_text: null, post_process_prompt: null, post_process_requested: false },
          { id: 1, file_name: "a.wav", timestamp: Math.floor(Date.now()/1000) - 7200, saved: true, title: "", transcription_text: "Please send the updated proposal to the client before Friday and copy the design team.", post_processed_text: null, post_process_prompt: null, post_process_requested: false },
        ], has_more: false },
        get_app_dir_path: () => "C:\\Users\\you\\AppData\\Roaming\\Silktone",
        get_log_dir_path: () => "C:\\Users\\you\\AppData\\Roaming\\Silktone\\logs",
        get_windows_microphone_permission_status: () => ({ supported: false, overall_access: "allowed" }),
        get_keyboard_implementation: () => "native_keys",
        get_secure_input_status: () => ({ active: false }),
        get_available_accelerators: () => ({ transcribe: [], ort: ["auto", "cpu"], gpu_devices: [] }),
      };
      window.__mockCalls = [];
      let nextId = 1;
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main", windowLabel: "main" },
        },
        transformCallback: () => nextId++,
        convertFileSrc: (p) => p,
        invoke: async (cmd, args) => {
          window.__mockCalls.push(cmd);
          if (handlers[cmd]) return handlers[cmd](args);
          if (/^(get_|list_|fetch_).*(s|devices|entries|models|tools)$/.test(cmd)) return [];
          if (/^(is_|has_|check_)/.test(cmd)) return false;
          return null;
        },
      };
      window.__TAURI_OS_PLUGIN_INTERNALS__ = {
        platform: "windows",
        os_type: "windows",
        family: "windows",
        arch: "x86_64",
        version: "10.0.26200",
        eol: "\r\n",
        exe_extension: "exe",
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };

      // ?account=trial|offline|stale|expired|banned|paid|cancelling|due|lapsed
      // fakes a signed-in account;
      // without it the real sign-in screen shows.
      const account = new URLSearchParams(location.search).get("account");
      if (account) {
        const day = 24 * 60 * 60 * 1000;
        const isPaid = ["paid", "cancelling", "due"].includes(account);
        const blocked = ["expired", "banned", "lapsed"].includes(account);
        const access = {
          status: isPaid ? "paid" : account === "lapsed" ? "expired" : blocked ? account : "trial",
          allowed: !blocked,
          trial_ends_at: new Date(Date.now() + 12 * day).toISOString(),
          paid_until: isPaid || account === "lapsed"
            ? new Date(Date.now() + (account === "due" ? -1 : account === "lapsed" ? -9 : 21) * day).toISOString()
            : null,
          cancel_at_period_end: account === "cancelling",
        };
        const paidAccess = () => Object.assign(access, {
          status: "paid", allowed: true, cancel_at_period_end: false,
          paid_until: new Date(Date.now() + 30 * day).toISOString(),
        });
        const reply = (body, status = 200) => Promise.resolve(new Response(
          JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } }));
        localStorage.setItem("silktone.session", JSON.stringify({
          access_token: "mock", refresh_token: "mock",
          expires_at: Math.floor(Date.now() / 1000) + 3600, email: "you@example.com",
        }));
        const checkedAt = Date.now() - (account === "stale" ? 4 * day : 0);
        localStorage.setItem("silktone.access", JSON.stringify({ access, checkedAt, lastSeen: checkedAt }));
        const realFetch = window.fetch.bind(window);
        window.fetch = (input, init) => {
          const url = String(input && input.url ? input.url : input);
          if (!url.includes("supabase.co")) return realFetch(input, init);
          if (account === "offline" || account === "stale") return Promise.reject(new TypeError("offline"));
          // Subscribing "succeeds" a few seconds later; ?pay=fail shows the error.
          if (url.includes("/functions/v1/create-subscription")) {
            if (new URLSearchParams(location.search).get("pay") === "fail") return reply({ error: "server_error" }, 500);
            setTimeout(paidAccess, 4000);
            return reply({ url: "https://rzp.io/rzp/mock" });
          }
          if (url.includes("/functions/v1/cancel-subscription")) {
            access.cancel_at_period_end = true;
            return reply({ ok: true });
          }
          return reply(access);
        };
      } else {
        localStorage.removeItem("silktone.session");
        localStorage.removeItem("silktone.access");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
